id: ice_slow
display_name: "冰霜减速"
description:
  - "&b攻击时有 {chance}% 概率使目标减速 {duration} 秒"
max_level: 3
rarity: UNCOMMON
category: weapon
exclusive_group: "ice"
tags:
  - ice
  - control

levels:
  1: { chance: 15, duration: 2 }
  2: { chance: 20, duration: 3 }
  3: { chance: 25, duration: 4 }

triggers:
  - type: ON_ATTACK
    conditions:
      - type: CHANCE
        value: "{chance}"
    actions:
      - type: POTION
        effect: SLOW
        duration: "{duration}"
        amplifier: 1
      - type: PARTICLE
        particle: SNOWFLAKE
        count: 15
      - type: SOUND
        sound: "block.glass.break"
        volume: 0.8
        pitch: 1.5
