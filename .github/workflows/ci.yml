name: 构建验证

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: 完整构建
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 校验 Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 允许执行 Gradle Wrapper
        run: chmod +x ./gradlew

      - name: 构建并运行测试
        run: ./gradlew clean build --no-daemon --max-workers=1

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Symphony-${{ github.sha }}
          path: |
            symphony-bukkit/build/libs/symphony-bukkit-*.jar
            !symphony-bukkit/build/libs/symphony-bukkit-*-plain.jar
            symphony-api/build/libs/symphony-api-*.jar
          if-no-files-found: error
