schema: 1
id: stormfront
name: 雷暴前线
when:
  outdoor: true
  weather: thunder
modifiers:
  lightning_amplification:
    operation: add
    value: 20%
  ice_resistance:
    operation: add
    value: 10%
callbacks:
  storm_notice:
    trigger: combat.damage_dealt
    conditions:
      - type: cooldown
        key: stormfront_notice
        duration-ms: 10000
    actions:
      - type: message
        message: '§9雷暴前线正在强化你的雷电伤害'
        target: self
